name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  # Test DB — spun up by the postgres service container
  TEST_DATABASE_URL: postgresql://fintech_user:fintech_pass@localhost:5432/fintech_test_db
  DATABASE_URL: postgresql://fintech_user:fintech_pass@localhost:5432/fintech_db
  JWT_SECRET: ci-test-secret-not-for-production
  JWT_EXPIRES_IN: 1h
  ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  NODE_ENV: test

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  # ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests + Mutation Score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit -- --coverage

      - name: Run Stryker mutation tests
        run: npm run test:mutation
        # Stryker exits non-zero if mutation score < thresholds.break (75%)

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/

  # ─────────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fintech_user
          POSTGRES_PASSWORD: fintech_pass
          POSTGRES_DB: fintech_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Create test database
        run: |
          PGPASSWORD=fintech_pass psql -h localhost -U fintech_user -d fintech_db \
            -c "CREATE DATABASE fintech_test_db OWNER fintech_user;"

      - name: Run migrations (main DB)
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run migrations (test DB)
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Run integration tests
        run: npm run test:integration

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: coverage/

  # ─────────────────────────────────────────────────────────────────────────────
  contract-tests:
    name: Pact Consumer Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Run consumer contract tests (generates pact files)
        run: npm run test:contract:consumer

      - name: Publish pacts to broker
        if: github.ref == 'refs/heads/main' && env.PACT_BROKER_URL != ''
        run: npm run test:contract:publish
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
          GIT_COMMIT: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}

      - name: Upload pact files
        uses: actions/upload-artifact@v4
        with:
          name: pact-files
          path: pacts/

  # ─────────────────────────────────────────────────────────────────────────────
  performance-gate:
    name: k6 Smoke Performance Gate
    runs-on: ubuntu-latest
    needs: [integration-tests]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fintech_user
          POSTGRES_PASSWORD: fintech_pass
          POSTGRES_DB: fintech_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6 -y

      - name: Create test database and run migrations
        run: |
          PGPASSWORD=fintech_pass psql -h localhost -U fintech_user -d fintech_db \
            -c "CREATE DATABASE fintech_test_db OWNER fintech_user;"
          npm run db:migrate
          DATABASE_URL=$TEST_DATABASE_URL npm run db:migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Start API server
        run: |
          NODE_ENV=test node src/server.js &
          # Wait for the server to be ready
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/health && break
            sleep 2
          done
        env:
          NODE_ENV: test
          PORT: 3000

      - name: Run k6 smoke test (performance gate)
        run: k6 run --env BASE_URL=http://localhost:3000 tests/performance/smoke.js
        # k6 exits non-zero if any threshold is breached — fails the CI job

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-smoke-results
          path: k6-results/

  # ─────────────────────────────────────────────────────────────────────────────
  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # PCI-DSS 6.3.3 — all software components protected from known vulnerabilities
      # --omit=dev scopes the check to production dependencies only
      - run: npm audit --audit-level=high --omit=dev
